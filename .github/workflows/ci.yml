name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, responsive-mobile-desktop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Build backend Docker image
        run: docker build -f Dockerfile -t ledgr-backend:ci .

      - name: Build frontend Docker image
        run: docker build -f client/Dockerfile --build-arg VITE_API_URL=http://localhost:3001 -t ledgr-frontend:ci .
